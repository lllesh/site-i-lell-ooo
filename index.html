  :root {
    --bg: #FFFBF3;
    --ink: #241f2e;
    --rosa: #F48591;
    --coral: #FA8D85;
    --pessego: #FEA283;
    --laranja: #FFB872;
    --salvia: #8DA599;
    --periwinkle: #8D96C1;
    --malva: #C18EA9;
    --font-ui: 'Manrope', sans-serif;
    --font-body: 'Karla', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--bg); }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    padding: clamp(20px, 6vw, 96px) 120px;
  }
  @media (max-width: 1023px) {
    body { padding-left: 24px; padding-right: 24px; }
  }

  .pagina {
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3vh, 40px);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
  }
  .kicker {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(36,31,46,.55);
  }
  h1 {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: clamp(24px, 2.6vw, 34px);
    letter-spacing: -.01em;
    margin-top: 4px;
  }

  .status {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--salvia);
    color: #1e2f26;
  }

  .alvo {
    display: inline-flex;
    gap: 14px;
    width: fit-content;
  }
  .alvo button {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -.02em;
    text-transform: lowercase;
    border: none;
    background: rgba(36,31,46,.06);
    color: rgba(36,31,46,.6);
    padding: 16px 30px;
    border-radius: 999px;
    cursor: pointer;
  }
  .alvo button.ativo { background: var(--ink); color: #fff; }

  /* ---------- prévia ---------- */
  .previa {
    --carta-raio: 140px;
    position: relative;
    background: var(--periwinkle);
    border-radius: var(--carta-raio);
    aspect-ratio: 1344 / 726;
    overflow-y: auto;
    box-shadow: 0 24px 60px rgba(36,31,46,.18);
    padding: clamp(90px, 11vw, 170px) clamp(40px, 5vw, 80px) clamp(40px, 5vw, 80px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: clamp(40px, 5vw, 64px);
  }
  .previa .duas {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(40px, 6vw, 76px);
    width: var(--bloco-w, 78%);
    font-size: clamp(20px, 1.4vw, 24px);
  }
  .previa .rotulo-mini {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 14px;
    display: block;
  }
  #amostraHeading { text-wrap: balance; max-width: 100%; }
  #amostraBody { max-width: 100%; }

  /* ---------- controles coloridos, translúcidos por cima do texto ---------- */
  .pilulas {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    padding: clamp(40px, 6vw, 90px);
    background: transparent;
    opacity: 0;
    visibility: hidden;
    transform: scale(.98);
    transition: opacity .25s ease, transform .25s ease, visibility 0s .25s;
  }
  .pilulas .painel { opacity: .22; }
  .alinhar-botoes {
    flex: 1;
    display: flex;
    gap: 8px;
  }
  .alinhar-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    border: none;
    border-radius: 999px;
    background: rgba(255,255,255,.22);
    color: var(--bg);
    cursor: pointer;
  }
  .alinhar-btn svg { width: 20px; height: 20px; }
  .alinhar-btn.ativo { background: rgba(255,255,255,.9); color: var(--ink); }
  .previa.controles-abertos .pilulas {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    transition: opacity .25s ease, transform .25s ease;
  }
  .pontinho {
    position: fixed;
    top: clamp(48px, 7vw, 76px);
    right: clamp(48px, 7vw, 76px);
    z-index: 50;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: none;
    background: #fff;
    box-shadow: 0 4px 14px rgba(36,31,46,.35);
    cursor: pointer;
    padding: 0;
  }
  .previa.controles-abertos .pontinho { background: #fff; }
  .pilula {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 56px;
    background: rgba(255,255,255,.14);
    border-radius: 9999px;
    padding: 0 16px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.08);
    transition: transform .2s ease-out;
  }
  .pilula:hover { transform: translateY(-2px) scale(1.01); }
  .pilula:active { transform: translateY(0) scale(.98); }
  .pilula .pilula-label {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .8;
    white-space: nowrap;
    width: 90px;
    flex-shrink: 0;
  }
  .pilula .pilula-valor {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 13px;
    width: 90px;
    flex-shrink: 0;
    text-align: right;
    white-space: nowrap;
  }
  .pilula input[type="range"] {
    flex: 1;
    min-width: 0;
  }
  .pilula select.fonte-painel {
    flex: 1;
    min-width: 0;
    padding: 8px 14px;
    font-size: 14px;
  }

  select.fonte-painel {
    font-family: var(--font-ui);
    font-weight: 700;
    color: var(--bg);
    background: rgba(255,255,255,.18);
    border: none;
    border-radius: 999px;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  select.fonte-painel option { color: var(--ink); }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 999px;
    background: var(--bg);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 7px; height: 26px;
    margin-top: -11px;
    border-radius: 3px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 7px; height: 26px;
    border: none;
    border-radius: 3px;
    background: #fff;
    cursor: pointer;
  }

  .rotulo-painel {
    font-family: var(--font-ui);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    opacity: .85;
  }

  /* ---------- pílulas coloridas, no molde exato da pílula do portrait.boook.ing ---------- */
  .painel {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 74px;
    border-radius: 9999px;
    padding: 0 34px;
    color: var(--bg);
    transition: transform .2s ease-out;
  }
  .painel.painel-fonte {
    height: clamp(200px, 26vh, 320px);
    border-radius: 48px;
    padding: 0;
    overflow: hidden;
  }
  .fonte-roda {
    position: relative;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
  }
  .fonte-roda::-webkit-scrollbar { display: none; }
  .fonte-roda-track { display: flex; flex-direction: column; height: 100%; }
  .fonte-item, .fonte-spacer {
    scroll-snap-align: center;
    flex-shrink: 0;
    height: clamp(60px, 9vh, 100px);
  }
  .fonte-spacer { height: calc(50% - clamp(60px, 9vh, 100px) / 2); }
  .fonte-item {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    color: var(--bg);
    padding: 0 30px;
    font-weight: 700;
    font-size: clamp(15px, 2vw, 20px);
    opacity: .32;
    transform: scale(.75);
    transition: opacity .25s ease, transform .25s ease;
    cursor: pointer;
  }
  .fonte-item span {
    display: block;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }
  .fonte-item.ativa {
    opacity: 1;
    transform: scale(1);
    font-weight: 800;
    font-size: clamp(22px, 3.6vw, 36px);
  }
  @media (min-width: 1024px) {
    .painel { height: 92px; padding: 0 44px; }
    .painel .rotulo-painel { font-size: 16px; width: 110px; }
    .painel .valor-painel { font-size: 15px; width: 110px; }
    .painel select.fonte-painel { font-size: 16px; }
  }
  .painel:hover { transform: translateY(-2px) scale(1.01); }
  .painel:active { transform: translateY(0) scale(.98); }
  .painel .rotulo-painel {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .2em;
    text-transform: uppercase;
    white-space: nowrap;
    width: 100px;
    flex-shrink: 0;
  }
  .painel .valor-painel {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 14px;
    width: 100px;
    flex-shrink: 0;
    text-align: right;
    white-space: nowrap;
  }
  .painel input[type="range"] {
    flex: 1;
    min-width: 0;
  }
  .painel select.fonte-painel {

    min-width: 0;
    padding: 10px 16px;
    font-size: 15px;
  }
  .instalada-tag {

    font-weight: 700;
    font-size: 12px;
    opacity: .8;
  }

    flex: 1;
    align-self: center;
    height: 46px;
    min-width: 0;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--bg);
    background: rgba(255,255,255,.18);
    border: none;
    border-radius: 999px;

    }
  }
</style>

sic","Roketto Retro Bold Display Font","Rolan Food Logo Font","Rough Tagline Handwritten Display Font","Round Bold Font For Food Branding Gelipo","Roundhe","Seaside Courier Handmade Sans Script Font Duo","Seatren Bold Sans Display Font","Selantic Bold Brush Font","Set List","Sinome Quirky Retro Display Font","Slideback A Stylish Modern Display Script","Smacko Retro Bold Reverse Condensed Sans Serif","Snarky Display Font","Snorble Sans Serif Display Font","Softsketch Creative Display Fonts","Southbased","Splish Splash","Spotlight","Sprout Pop Bold Retro Display Font","Sunkind Display Playful Retro Mixed Font","Sunkiss Muse Summer Retro Display Sans Script","Sunny Side","Sunset Script Handwritten Font","Super Meaty Retro Bold Display Font","Superbusy Activity Fun Pairing Font","Technul Regular","Technul Regular Soft","The Burcey Fun Display Font","The Reporter","The Untold Story Quotable Font","Thelawss Retro Funky Font","Thinkmore Playful Wide Font","Thumpa Bold Sans Serif","Todari Bold Food Display Font","Tonia","Trivane Bold Retro Reverse Contrast","Triver Bold Inktrap Font","Tropic Fresh Vintage Bold Serif Font","Tuck Shop Font","Twicker Playful Sketch Font","Unspoken Story Handwritten","Vank Strong Bold Condensed","Vlox Spray Hand Drawn Typeface","Warto Display Cute Bubble Font For Kids","West Paras Sans","Wildhorse Canyon","Wobico","Worthbites Display Font","Woster Sans","Zesty Scribs A Playful Script Font"];
  var INSTALLED = { 'Mesa': true, 'NotMyType': true };
  var PF_COUNT = 196;
  for (var pfi = 0; pfi < PF_COUNT && pfi < FONT_NAMES.length; pfi++) {
    INSTALLED[FONT_NAMES[pfi]] = 'pf' + pfi;
  }
  INSTALLED['Jeffesta Bold Retro Pop Fonts'] = 'Jeffesta Bold Retro Pop Fonts';
  var weightLabels = { 300: 'light', 400: 'regular', 500: 'medium', 600: 'semibold', 700: 'bold', 800: 'extrabold', 900: 'black' };

  var DEFAULTS = {
    body: { font: 'Mesa', weight: 700, letterSpacing: -0.02, lineHeight: 1.75, fontSize: 114 },
    heading: { font: 'Mesa', weight: 700, letterSpacing: -0.02, lineHeight: 1.2, fontSize: 114 }
  };
  var state = { body: Object.assign({}, DEFAULTS.body), heading: Object.assign({}, DEFAULTS.heading), note: '', blocoLargura: 78, alinhar: 'left' };
  var alvo = 'body';

  function fontStack(name) {
    var fam = INSTALLED[name];
    if (fam === true) return "'" + name + "', sans-serif";
    if (typeof fam === 'string') return "'" + fam + "', sans-serif";
    return "ui-sans-serif, system-ui, sans-serif";
  }

  var ALL_FONTS = ['Mesa', 'NotMyType'].concat(FONT_NAMES);

  function montarRoda() {
    var track = document.getElementById('fonteRodaTrack');
    var html = '<div class="fonte-spacer"></div>';
    html += ALL_FONTS.map(function (name) {
      return '<div class="fonte-item" data-font="' + name.replace(/"/g, '&quot;') + '"><span style="font-family:' + fontStack(name) + '">' + name + '</span></div>';
    }).join('');
    html += '<div class="fonte-spacer"></div>';
    track.innerHTML = html;
    track.querySelectorAll('.fonte-item').forEach(function (el) {
      el.addEventListener('click', function () {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      });
    });
    var roda = document.getElementById('fonteRoda');
    var pendente = null;
    roda.addEventListener('scroll', function () {
      atualizarRodaAtiva();
      clearTimeout(pendente);
      pendente = setTimeout(function () {
        var ativo = track.querySelector('.fonte-item.ativa');
        if (ativo) {
          var nome = ativo.getAttribute('data-font');
          if (nome !== state[alvo].font) {
            state[alvo].font = nome;
            renderControles();
            renderPrevia();
            agendarSalvar();
          }
        }
      }, 120);
    });
  }

  function atualizarRodaAtiva() {
    var roda = document.getElementById('fonteRoda');
    var centro = roda.getBoundingClientRect().top + roda.clientHeight / 2;
    var itens = roda.querySelectorAll('.fonte-item');
    var maisProximo = null, menorDist = Infinity;
    itens.forEach(function (el) {
      var r = el.getBoundingClientRect();
      var dist = Math.abs((r.top + r.height / 2) - centro);
      if (dist < menorDist) { menorDist = dist; maisProximo = el; }
    });
    itens.forEach(function (el) { el.classList.toggle('ativa', el === maisProximo); });
  }

  function scrollRodaPara(nome, suave) {
    var track = document.getElementById('fonteRodaTrack');
    var alvoEl = track.querySelector('.fonte-item[data-font="' + nome.replace(/"/g, '\\"') + '"]');
    if (alvoEl) alvoEl.scrollIntoView({ block: 'center', behavior: suave ? 'smooth' : 'auto' });
  }

  function renderControles() {
    var t = state[alvo];
    document.getElementById('weightRange').value = t.weight;
    document.getElementById('weightVal').textContent = t.weight + ' · ' + (weightLabels[t.weight] || '');
    document.getElementById('sizeRange').value = t.fontSize;
    document.getElementById('sizeVal').textContent = t.fontSize + '%';
    document.getElementById('trackingRange').value = t.letterSpacing;
    document.getElementById('trackingVal').textContent = t.letterSpacing.toFixed(3) + 'em';
    document.getElementById('leadingRange').value = t.lineHeight;
    document.getElementById('leadingVal').textContent = t.lineHeight.toFixed(2);
    document.getElementById('widthRange').value = state.blocoLargura;
    document.getElementById('widthVal').textContent = state.blocoLargura + '%';
  }

  function renderPrevia() {
    var h = state.heading, b = state.body;
    ['amostraHeading', 'amostraHeading2'].forEach(function (id) {
      var hEl = document.getElementById(id);
      if (!hEl) return;
      hEl.style.fontFamily = fontStack(h.font);
      hEl.style.fontWeight = h.weight;
      hEl.style.letterSpacing = h.letterSpacing + 'em';
      hEl.style.lineHeight = h.lineHeight;
      hEl.style.fontSize = (h.fontSize / 100 * 2.1) + 'em';
    });
    ['amostraBody', 'amostraBody2'].forEach(function (id) {
      var bEl = document.getElementById(id);
      if (!bEl) return;
      bEl.style.fontFamily = fontStack(b.font);
      bEl.style.fontWeight = b.weight;
      bEl.style.letterSpacing = b.letterSpacing + 'em';
      bEl.style.lineHeight = b.lineHeight;
      bEl.style.fontSize = (b.fontSize / 100) + 'em';
      bEl.style.textAlign = state.alinhar;
    });
  }

  function renderLayout() {
    document.querySelector('.previa').style.setProperty('--bloco-w', state.blocoLargura + '%');
  }

  var salvarPendente = null;
  function agendarSalvar() {
    clearTimeout(salvarPendente);
    salvarPendente = setTimeout(function () {
      fetch('/api/estado', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ body: state.body, heading: state.heading, blocoLargura: state.blocoLargura, alinhar: state.alinhar })
      }).catch(function () {});
    }, 500);
  }

  function carregarEstado() {
    fetch('/api/estado').then(function (r) { return r.json(); }).then(function (dados) {
      if (!dados) return;
      if (dados.body) Object.assign(state.body, dados.body);
      if (dados.heading) Object.assign(state.heading, dados.heading);
      if (typeof dados.blocoLargura === 'number') state.blocoLargura = dados.blocoLargura;
      if (dados.alinhar) state.alinhar = dados.alinhar;
      renderControles();
      renderPrevia();
      renderLayout();
      scrollRodaPara(state[alvo].font, false);
      document.querySelectorAll('#alinharBotoes .alinhar-btn').forEach(function (b) {
        b.classList.toggle('ativo', b.getAttribute('data-align') === state.alinhar);
      });
    }).catch(function () {});
  }

  function attach() {
    var cartaTexto = document.getElementById('cartaTexto');
    document.getElementById('pontinhoAbrir').addEventListener('click', function () {
      cartaTexto.classList.toggle('controles-abertos');
    });

    document.querySelectorAll('#alinharBotoes .alinhar-btn').forEach(function (btn) {
      if (btn.getAttribute('data-align') === state.alinhar) btn.classList.add('ativo');
      btn.addEventListener('click', function () {
        document.querySelectorAll('#alinharBotoes .alinhar-btn').forEach(function (b) { b.classList.toggle('ativo', b === btn); });
        state.alinhar = btn.getAttribute('data-align');
        renderPrevia();
        agendarSalvar();
      });
    });

    document.querySelectorAll('.alvo button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.alvo button').forEach(function (b) { b.classList.toggle('ativo', b === btn); });
        alvo = btn.getAttribute('data-target');
        renderControles();
      });
    });

    document.getElementById('weightRange').addEventListener('input', function (e) {
      state[alvo].weight = Number(e.target.value);
      renderControles();
      renderPrevia();
      agendarSalvar();
    });
    document.getElementById('sizeRange').addEventListener('input', function (e) {
      state[alvo].fontSize = Number(e.target.value);
      renderControles();
      renderPrevia();
      agendarSalvar();
    });
    document.getElementById('trackingRange').addEventListener('input', function (e) {
      state[alvo].letterSpacing = Number(e.target.value);
      renderControles();
      renderPrevia();
      agendarSalvar();
    });
    document.getElementById('leadingRange').addEventListener('input', function (e) {
      state[alvo].lineHeight = Number(e.target.value);
      renderControles();
      renderPrevia();
      agendarSalvar();
    });
    document.getElementById('widthRange').addEventListener('input', function (e) {
      state.blocoLargura = Number(e.target.value);
      renderControles();
      renderLayout();
      agendarSalvar();
    });
  }

  montarRoda();
  renderControles();
  renderPrevia();
  renderLayout();
  attach();
  scrollRodaPara(state[alvo].font, false);
  setTimeout(atualizarRodaAtiva, 50);
  carregarEstado();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js'); });
  }
})();
</script>
<script src="/pwa-install.js"></script><script>
(function(){
  function send(){try{if(window.parent!==window)window.parent.postMessage({source:"lell-color",color:getComputedStyle(document.body).backgroundColor},"*")}catch(e){}}
  if (document.readyState === "complete" || document.readyState === "interactive") { send(); } else { window.addEventListener("DOMContentLoaded", send); }
  window.addEventListener("load", send);
  new MutationObserver(send).observe(document.documentElement, {attributes:true, attributeFilter:["class","style","data-theme","data-mode"]});
  new MutationObserver(send).observe(document.body, {attributes:true, attributeFilter:["class","style","data-theme","data-mode"]});
})();
</script>
